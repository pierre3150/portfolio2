server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Routage cote client en hash (#/projects, #/about...) - un seul fichier
    # HTML sert toutes les routes, pas besoin de try_files complexe.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets hashes par Vite (index-XXXX.js/css) - cache long, le nom change
    # a chaque build donc pas de risque de servir une version perimee.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
